[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyterm"
version = "0.1.0"
description = "Lightweight Polymarket CLOB trading terminal"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.79.0",
    "py-clob-client>=0.18.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["polyterm*"]

[project.scripts]
polyterm = "polyterm.app:main"
